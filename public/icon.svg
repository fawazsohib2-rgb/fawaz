<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background App Icon Shape (Apple Squircle / Rounded Rect) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  <!-- Gloss overlay -->
  <rect x="24" y="24" width="464" height="232" rx="96" fill="url(#innerGlow)" />
  <!-- Sigma Symbol ∑ -->
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, sans-serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4">∑</text>
  <!-- Small Star Sparkle in top right -->
  <circle cx="390" cy="120" r="16" fill="#facc15" />
</svg>
